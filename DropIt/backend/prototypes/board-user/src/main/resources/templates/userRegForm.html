<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Copatible" content="IE=edge0"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입폼</title>
    <script>
        let idChecked = false;       // 아이디 중복확인 여부
        let nicknameChecked = false; // 닉네임 중복확인 여부

        function validateForm() {
            let id = document.querySelector("input[name='id']").value;
            let pw = document.querySelector("input[name='password']").value;
            let pwCheck = document.querySelector("input[name='password_check']").value;
            let email = document.querySelector("input[name='email']").value;

            // 아이디/이메일/비밀번호 → 한글 금지
            let koreanRegex = /[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/;
            if (koreanRegex.test(id)) {
                alert("아이디에는 한글을 사용할 수 없습니다.");
                return false;
            }
            if (koreanRegex.test(email)) {
                alert("이메일에는 한글을 사용할 수 없습니다.");
                return false;
            }
            if (koreanRegex.test(pw)) {
                alert("비밀번호에는 한글을 사용할 수 없습니다.");
                return false;
            }

            // 아이디 중복확인 검증
            if (!idChecked) {
                alert("아이디 중복확인을 해주세요.");
                return false;
            }

            // 닉네임 중복확인 검증
            if (!nicknameChecked) {
                alert("닉네임 중복확인을 해주세요.");
                return false;
            }

            // 비밀번호 확인 검증
            if (pw !== pwCheck) {
                alert("비밀번호와 비밀번호 확인이 일치하지 않습니다.");
                return false;
            }

            // 이메일 형식 검증
            if (!email.includes("@")) {
                alert("올바른 이메일 형식을 입력하세요.");
                return false;
            }

            // 비밀번호 복잡성 검증 (8~20자리, 대문자/소문자/숫자/특수문자 포함)
            let pwRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_])[A-Za-z\d\W_]{8,20}$/;
            if (!pwRegex.test(pw)) {
                alert("비밀번호는 8~20자리이며, 영문 대소문자, 숫자, 특수문자를 모두 포함해야 합니다.");
                return false;
            }

            return true;
        }

        // 아이디/닉네임 중복확인
        function checkDuplicate(type) {
            let value = document.querySelector("input[name='" + type + "']").value;
            if (!value) {
                alert(type + "을(를) 입력해주세요.");
                return;
            }

            fetch(`/checkDuplicate?type=${type}&value=${value}`)
                .then(response => response.text())
                .then(result => {
                    if (result === "duplicate") {
                        alert(type + "이(가) 이미 사용 중입니다.");
                        if (type === "id") idChecked = false;
                        if (type === "nickname") nicknameChecked = false;
                    } else {
                        alert(type + "을(를) 사용할 수 있습니다!");
                        if (type === "id") idChecked = true;
                        if (type === "nickname") nicknameChecked = true;
                    }
                })
                .catch(error => console.error("Error:", error));
        }
    </script>
</head>
<body>
<h1>회원가입폼</h1>
<!-- http://localhost:9090/userRegForm 로 전달됨. -->
<form action="/userReg" method="post" onsubmit="return validateForm()">
    아이디: <input type="text" name="id" />
    <button type="button" onclick="checkDuplicate('id')">중복확인</button><br />
    비밀번호: <input type="text" name="password" /><br />
    비밀번호 확인: <input type="text" name="password_check" /><br />
    닉네임: <input type="text" name="nickname" />
    <button type="button" onclick="checkDuplicate('nickname')">중복확인</button><br />
    이메일: <input type="text" name="email" /><br />
    <input type="submit" value="회원가입" />
</form>
</body>
</html>
