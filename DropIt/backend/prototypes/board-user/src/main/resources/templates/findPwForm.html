<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기</title>
</head>
<body>
<h1>비밀번호 찾기</h1>
<form action="/findPw" method="post">
    아이디: <input type="text" name="id"><br>
    이메일: <input type="text" name="email"><br>
    <input type="submit" value="비밀번호 찾기">
</form>

<!-- 결과 팝업 -->
<div th:if="${foundPw != null}">
    <script>alert("찾은 비밀번호: [[${foundPw}]]");</script>
</div>
<div th:if="${findError != null}">
    <script>alert("[[${findError}]]");</script>
</div>

</body>
</html>
