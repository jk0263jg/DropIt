<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
<h2>회원가입</h2>

<form id="signup-form">
    <label>아이디 <input type="text" id="username" required></label><br>
    <label>비밀번호 <input type="password" id="password" required></label><br>
    <label>비밀번호 확인 <input type="password" id="confirmPassword" required></label><br>
    <label>닉네임 <input type="text" id="nickname" required></label><br>
    <label>이메일 <input type="email" id="email" required></label><br>

    <button type="submit" id="signup-button">가입하기</button>
    <p id="error-message" style="color: red;"></p>
</form>

<script>
    const form = document.getElementById("signup-form");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const errorMessage = document.getElementById("error-message");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (password !== confirmPassword) {
            errorMessage.textContent = "❌ 비밀번호가 일치하지 않습니다.";
            return;
        }

        // 비밀번호 일치 → 회원가입 요청 보내기
        const response = await fetch("/api/auth/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: document.getElementById("username").value,
                password: password,
                nickname: document.getElementById("nickname").value,
                email: document.getElementById("email").value
            })
        });

        if (response.ok) {
            alert("✅ 회원가입 성공!");
            window.location.href = "/login.html"; // 로그인 페이지로 이동
        } else {
            const result = await response.text();
            errorMessage.textContent = "🚫 회원가입 실패: " + result;
        }
    });
</script>
</body>
</html>
