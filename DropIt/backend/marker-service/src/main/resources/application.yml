spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/board?serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true